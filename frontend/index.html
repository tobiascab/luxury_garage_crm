<!doctype html>
<html lang="es" translate="no">

<head>
  <meta charset="UTF-8" />
  <!-- Theme init: runs BEFORE React, prevents dark flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      // Only go dark if user explicitly chose it. Never follow OS.
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
        if (!saved) localStorage.setItem('theme', 'light');
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />

  <title>Luxury Garage</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
